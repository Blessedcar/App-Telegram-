<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BLESSED PLAN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--surface:rgba(12,12,14,.72);--ink:#F1ECFA;--muted:#A79EC0;--line:rgba(139,92,246,.6);--accent:#7A47F0;--on:#fff;--ok:#7A47F0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:transparent;color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{padding:18px 20px 8px;max-width:560px;width:100%;margin:0 auto}
h1{font-size:26px;margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px;min-height:20px;margin-top:2px}
main{flex:1;overflow-y:auto;padding:8px 16px 16px;max-width:560px;width:100%;margin:0 auto}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.row{display:flex;gap:8px;margin-bottom:12px}
input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
input:focus-visible,button:focus-visible{outline:2px solid #B79CFF;outline-offset:2px}
.btn{font:inherit;font-weight:600;background:var(--accent);color:var(--on);border:0;border-radius:12px;padding:0 18px;cursor:pointer}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.item span{flex:1;overflow-wrap:anywhere}
.item.done span{color:var(--muted);text-decoration:line-through}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:none;color:var(--on);font-weight:700;cursor:pointer;padding:0;flex:none}
.item.done .chk{background:var(--ok);border-color:var(--ok)}
.x{background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer;padding:0 4px}
.empty{color:var(--muted);text-align:center;padding:28px 12px}
.habit{--p:0%;background:linear-gradient(90deg,rgba(122,71,240,.4) 0,rgba(122,71,240,.4) calc(var(--p) - 2px),rgba(183,156,255,.85) calc(var(--p) - 2px),rgba(183,156,255,.85) var(--p),transparent var(--p)),var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.top b{flex:1;overflow-wrap:anywhere}
.streak{font-size:13px;color:var(--muted);font-weight:600}
.htxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.htxt b{flex:none;font-size:17px}
.htxt small{color:var(--muted);font-size:13px}
.hp{font-size:24px;font-weight:700;line-height:1;text-align:right}
.hp small{display:block;margin-top:3px;font-size:11px;font-weight:400;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;padding:0}
.day i{width:100%;max-width:40px;aspect-ratio:1;border-radius:10px;border:2px solid var(--line);display:block}
.day.on i{background:var(--ok);border-color:var(--ok)}
.day.today{color:var(--ink);font-weight:700}
.day.today:not(.on) i{border-color:var(--accent)}
.day:disabled{opacity:.4;cursor:default}
.wrap{flex-wrap:wrap}
.wrap #task-in{flex:1 1 100%}
.wrap .duebtn{flex:2 1 200px}
.wrap select{flex:1 1 120px}
.wrap .btn{min-height:44px;flex:1 1 100%}
select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 10px;min-width:0}
select:focus-visible{outline:2px solid #B79CFF;outline-offset:2px}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.pct{font-size:13px;color:var(--muted);font-weight:600}
.goal ul{margin-bottom:10px}
.goal .item{padding:8px 10px;background:rgba(255,255,255,.04)}
.mini{display:flex;gap:8px}
.mini input{padding:9px 12px}
.mini .btn{padding:0 16px;min-height:40px}
.item small{display:block;color:var(--muted);font-size:13px}
.item small.late{color:#FF7A7A}
nav{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line)}
nav button{font:inherit;font-size:13px;background:none;border:0;color:var(--muted);padding:10px 0 12px;cursor:pointer}
nav button[aria-selected="true"]{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--accent)}
@media(prefers-reduced-motion:no-preference){.chk,.day i{transition:background .15s,border-color .15s}}
.duebtn{font:inherit;text-align:left;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-width:0}
.duebtn.set{color:var(--ink)}
.cal-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.6)}
.cal-wrap[hidden]{display:none}
.cal{width:100%;max-width:340px;background:#1C1C26;border:1px solid var(--line);border-radius:24px;padding:20px 18px 18px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-head b{font-size:22px;letter-spacing:-.01em}
.cal-nav{display:flex;gap:4px}
.cal-nav button{display:flex;background:none;border:0;color:#B79CFF;padding:6px;border-radius:10px;cursor:pointer}
.cal-wd,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-wd{margin-bottom:4px}
.cal-wd span{text-align:center;color:var(--muted);font-size:13px;padding:6px 0}
.cd{aspect-ratio:1;background:none;border:0;border-radius:50%;color:var(--ink);font:inherit;font-size:16px;padding:0;cursor:pointer}
.cd.other{color:#6F6A80}
.cd.next1{color:#B79CFF}
.cd.today:not(.sel){box-shadow:inset 0 0 0 2px var(--line)}
.cd.sel{background:var(--accent);color:#fff;font-weight:700}
.cal-foot{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.cal-foot label{flex:1 1 100%;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.cal-foot .btn,.ghost{flex:1;padding:12px 16px}
.ghost{font:inherit;color:var(--ink);background:none;border:1px solid var(--line);border-radius:12px;cursor:pointer}

.cover.hide{opacity:0;visibility:hidden;transition:opacity .45s,visibility 0s .45s}
.cover h2{margin:0;font:800 clamp(40px,14vw,68px)/1.02 Montserrat,system-ui,sans-serif;letter-spacing:.1em;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.cv-line{display:block;width:64px;height:3px;border-radius:2px;background:var(--accent);margin:20px auto 16px}
.cover p{margin:0;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.78)}
.cv-btn{min-width:220px;padding:16px 28px;font-size:17px;letter-spacing:.04em;box-shadow:0 0 0 1px rgba(183,156,255,.55),0 10px 32px rgba(122,71,240,.45)}
.pl-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 8px}
.pl-head b{font-size:18px}
.daystrip{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 4px}
.ds{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--muted);font:inherit;font-size:12px;padding:0;cursor:pointer}
.ds b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;color:var(--ink);font-size:16px;font-weight:600}
.ds.today b{box-shadow:inset 0 0 0 2px var(--line)}
.ds.sel b{background:var(--accent);color:#fff;box-shadow:none}
.ds i{font-style:normal;font-size:11px;min-height:14px;color:var(--muted)}
.chips{display:flex;gap:8px;margin-bottom:12px}
.chip{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.chip.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.sect{color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.04em;margin:8px 4px 0}
.sect.late{color:#FF7A7A}
.gh{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:var(--ink);font:inherit;text-align:left;padding:0;cursor:pointer}
.gtxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.gtxt b{font-size:17px;overflow-wrap:anywhere}
.gtxt small{color:var(--muted);font-size:13px}
.chev{color:var(--muted);flex:none;transition:transform .2s}
.goal.open .chev{transform:rotate(180deg)}
.ring{color:var(--ink);flex:none}
.gbody{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.gl{color:var(--muted);font-size:13px;margin-bottom:6px}
.gchart{display:flex;align-items:flex-end;gap:6px;height:96px;margin-bottom:16px}
.gc{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
.gc i{display:block;width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:rgba(255,255,255,.12)}
.gc i.on{background:var(--accent)}
.gc em{font-style:normal;font-size:11px;color:var(--ink);min-height:13px}
.gc span{font-size:11px;color:var(--muted)}
.gdel{width:100%;margin-top:10px;color:#FF7A7A}
.hcal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.hwd{margin-bottom:2px}
.hwd span{text-align:center;color:var(--muted);font-size:12px}
.hc{width:100%;max-width:40px;aspect-ratio:1;justify-self:center;border:0;border-radius:50%;background:none;color:var(--ink);font:inherit;font-size:14px;padding:0;cursor:pointer}
.hc.today:not(.on){box-shadow:inset 0 0 0 2px var(--line)}
.hc.on{background:var(--accent);color:#fff;font-weight:700;box-shadow:0 0 0 1px rgba(183,156,255,.55)}

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#050505'); tg.setBackgroundColor('#050505'); } catch (e) {} }

const KEY = 'miniapp-v1';
let S = { tasks: [], habits: [], goals: [] };
try { const r = localStorage.getItem(KEY); if (r) S = Object.assign(S, JSON.parse(r)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);

function week() {
  const t = new Date(), dow = (t.getDay() + 6) % 7;
  return ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map((label, i) => {
    const d = new Date(t); d.setDate(t.getDate() - dow + i);
    return { key: iso(d), label, today: i === dow, future: i > dow };
  });
}
function streak(h) {
  let n = 0; const d = new Date();
  if (!h.done[iso(d)]) d.setDate(d.getDate() - 1);
  while (h.done[iso(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

const pad = n => String(n).padStart(2, '0');
function isLate(t) {
  if (t.done || !t.due) return false;
  const d = new Date();
  return t.due < (t.due.length > 10 ? `${iso(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}` : iso(d));
}
function dueLabel(v) {
  const [d, time] = v.split('T');
  const t = new Date(), n = new Date(); n.setDate(t.getDate() + 1);
  let label;
  if (d === iso(t)) label = 'Сегодня';
  else if (d === iso(n)) label = 'Завтра';
  else { const [y, m, day] = d.split('-'); label = `${day}.${m}.${y}`; }
  return time ? `${label}, ${time}` : label;
}
const mondayOf = d => { const m = new Date(d); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); m.setHours(0, 0, 0, 0); return m; };
let selDay = iso(new Date()), weekMon = mondayOf(new Date());
const dayKey = t => (t.due || '').slice(0, 10);
const timeOf = t => (t.due && t.due.length > 10 ? t.due.slice(11) : '');
const byTime = (a, b) => (a.done - b.done) || (timeOf(a) || '99').localeCompare(timeOf(b) || '99');
function dayHeading(k) {
  if (!k) return 'Без даты';
  const s = new Date(k + 'T00:00').toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function renderTasks() {
  const free = S.tasks.filter(t => !t.goalId), today = iso(new Date());
  const days = [...Array(7)].map((_, i) => { const d = new Date(weekMon); d.setDate(weekMon.getDate() + i); return d; });
  const WD = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
  $('#pl-title').textContent = `${MONTHS[days[0].getMonth()]} ${days[0].getFullYear()}`;
  $('#daystrip').innerHTML = days.map((d, i) => {
    const k = iso(d), n = free.filter(t => !t.done && dayKey(t) === k).length;
    return `<button class="ds ${k === selDay ? 'sel' : ''} ${k === today ? 'today' : ''}" data-a="dsel" data-day="${k}" aria-label="${d.getDate()} ${MONTHS[d.getMonth()]}"><span>${WD[i]}</span><b>${d.getDate()}</b><i>${n || ''}</i></button>`;
  }).join('');
  $('#chip-none').classList.toggle('sel', selDay === '');
  const row = (t, full) => {
    const meta = full ? (t.due ? dueLabel(t.due) : '') : timeOf(t);
    return `<li class="item ${t.done ? 'done' : ''}"><button class="chk" data-a="tt" data-id="${t.id}" aria-label="Отметить выполненной">${t.done ? '✓' : ''}</button><span>${esc(t.text)}${meta ? `<small class="${isLate(t) ? 'late' : ''}">${meta}</small>` : ''}</span><button class="x" data-a="td" data-id="${t.id}" aria-label="Удалить задачу">×</button></li>`;
  };
  const dayTasks = free.filter(t => dayKey(t) === selDay).sort(byTime);
  const overdue = selDay === today ? free.filter(t => !t.done && dayKey(t) && dayKey(t) < today).sort((a, b) => a.due.localeCompare(b.due)) : [];
  let html = '';
  if (overdue.length) html += '<li class="sect late">Просрочено</li>' + overdue.map(t => row(t, true)).join('');
  html += `<li class="sect">${dayHeading(selDay)}</li>`;
  html += dayTasks.length ? dayTasks.map(t => row(t, false)).join('')
    : `<li class="empty">${selDay ? 'На этот день задач нет. Добавь первую выше.' : 'Задач без даты нет.'}</li>`;
  $('#tasks-list').innerHTML = html;
  const open = dayTasks.filter(t => !t.done).length;
  $('#sub').textContent = dayTasks.length ? `Осталось: ${open} из ${dayTasks.length}` : '';
}
let habView = { y: new Date().getFullYear(), m: new Date().getMonth() };
function habitStats(h) {
  const { y, m } = habView, n = new Date(y, m + 1, 0).getDate(), pre = `${y}-${pad(m + 1)}-`;
  const done = Object.keys(h.done).filter(k => k.startsWith(pre)).length;
  return { pct: Math.round(done / n * 100), span: n };
}
function renderHabits() {
  const { y, m } = habView, n = new Date(y, m + 1, 0).getDate(), pre = `${y}-${pad(m + 1)}-`;
  const lead = (new Date(y, m, 1).getDay() + 6) % 7, todayKey = iso(new Date());
  $('#hab-title').textContent = `${MONTHS[m]} ${y}`;
  const wd = '<div class="hcal hwd">' + ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map(x => `<span>${x}</span>`).join('') + '</div>';
  $('#habits-list').innerHTML = S.habits.length ? S.habits.map(h => {
    const st = habitStats(h);
    let cells = '<span></span>'.repeat(lead);
    for (let d = 1; d <= n; d++) {
      const k = pre + pad(d);
      cells += `<button class="hc ${h.done[k] ? 'on' : ''} ${k === todayKey ? 'today' : ''}" data-a="hd" data-id="${h.id}" data-day="${k}" ${k > todayKey ? 'disabled' : ''}>${d}</button>`;
    }
    return `<li class="habit" style="--p:${st.pct}%"><div class="top"><div class="htxt"><b>${esc(h.name)}</b><small>${streak(h)} дн. подряд</small></div><span class="hp">${st.pct}%<small>за месяц</small></span><button class="x" data-a="hx" data-id="${h.id}" aria-label="Удалить привычку">×</button></div>${wd}<div class="hcal">${cells}</div></li>`;
  }).join('') : '<li class="empty">Привычек пока нет. Добавь первую выше.</li>';
  $('#sub').textContent = S.habits.length ? 'Заливка карточки: выполнение за месяц' : '';
}
const openGoals = new Set();
function ring(p, size = 46) {
  const c0 = size / 2, r = c0 - 4, c = 2 * Math.PI * r;
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Выполнено ${p}%"><circle cx="${c0}" cy="${c0}" r="${r}" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="5"/><circle cx="${c0}" cy="${c0}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p / 100)}" transform="rotate(-90 ${c0} ${c0})"/><text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" fill="currentColor" font-size="12" font-weight="700">${p}%</text></svg>`;
}
function weekChart(ts) {
  const days = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - 6 + i); return d; });
  const counts = days.map(d => ts.filter(t => t.doneAt === iso(d)).length), max = Math.max(1, ...counts);
  const WD = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
  return `<div class="gchart">${days.map((d, i) => `<div class="gc"><em>${counts[i] || ''}</em><i class="${counts[i] ? 'on' : ''}" style="height:${counts[i] ? 12 + Math.round(counts[i] / max * 40) : 4}px"></i><span>${WD[d.getDay()]}</span></div>`).join('')}</div>`;
}
function renderGoals() {
  $('#goals-list').innerHTML = S.goals.length ? S.goals.map(g => {
    const ts = S.tasks.filter(t => t.goalId === g.id), done = ts.filter(t => t.done).length, open = openGoals.has(g.id);
    const p = ts.length ? Math.round(done / ts.length * 100) : 0;
    const items = ts.map(t => `<li class="item ${t.done ? 'done' : ''}"><button class="chk" data-a="tt" data-id="${t.id}" aria-label="Отметить выполненной">${t.done ? '✓' : ''}</button><span>${esc(t.text)}</span><button class="x" data-a="td" data-id="${t.id}" aria-label="Удалить задачу">×</button></li>`).join('');
    const body = open ? `<div class="gbody"><div class="gl">Выполнено за последние 7 дней</div>${weekChart(ts)}${ts.length ? `<ul>${items}</ul>` : ''}<div class="mini"><input id="gt-${g.id}" placeholder="Добавить задачу к цели" maxlength="200"><button class="btn" data-a="gta" data-id="${g.id}" aria-label="Добавить задачу">+</button></div><button class="ghost gdel" data-a="gx" data-id="${g.id}">Удалить цель</button></div>` : '';
    return `<li class="goal ${open ? 'open' : ''}"><button class="gh" data-a="gtog" data-id="${g.id}" aria-expanded="${open}"><span class="gtxt"><b>${esc(g.name)}</b><small>${ts.length ? `Выполнено ${done} из ${ts.length}` : 'Пока нет задач'}</small></span>${ring(p)}<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>${body}</li>`;
  }).join('') : '<li class="empty">Целей пока нет. Добавь первую выше, а затем наполни её задачами.</li>';
  $('#sub').textContent = S.goals.length ? `Целей: ${S.goals.length}` : '';
}

const TITLES = { tasks: 'Задачи', habits: 'Привычки', goals: 'Цели' };
let tab = 'tasks';
function show(t) {
  tab = t;
  $('#title').textContent = TITLES[t];
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  ['tasks', 'habits', 'goals'].forEach(x => $('#v-' + x).hidden = x !== t);
  ({ tasks: renderTasks, habits: renderHabits, goals: renderGoals })[t]();
}

const under = document.querySelectorAll('header,main,nav'); under.forEach(e => e.inert = true);
$('.cv-btn').focus();
const MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
let dueVal = '', calSel = '', calView = { y: 0, m: 0 };
function updateDueBtn() {
  const b = $('#task-due');
  b.textContent = dueVal ? dueLabel(dueVal) : 'Выбрать срок';
  b.classList.toggle('set', !!dueVal);
}
function renderCal() {
  const { y, m } = calView, first = new Date(y, m, 1), start = (first.getDay() + 6) % 7;
  const total = Math.ceil((start + new Date(y, m + 1, 0).getDate()) / 7) * 7, today = iso(new Date());
  $('#cal-title').textContent = `${MONTHS[m]} ${y}`;
  let html = '';
  for (let i = 0; i < total; i++) {
    const d = new Date(y, m, 1 - start + i), k = iso(d), other = d.getMonth() !== m;
    const cls = ['cd', other && 'other', other && d > first && d.getDate() === 1 && 'next1', k === today && 'today', k === calSel && 'sel'].filter(Boolean).join(' ');
    html += `<button class="${cls}" data-a="cp" data-day="${k}">${d.getDate()}</button>`;
  }
  $('#cal-grid').innerHTML = html;
}
function openCal() {
  const [d, t] = dueVal ? dueVal.split('T') : ['', ''];
  const base = d ? new Date(d + 'T00:00') : new Date();
  calSel = d; calView = { y: base.getFullYear(), m: base.getMonth() };
  $('#cal-time').value = t || '';
  renderCal(); $('#cal').hidden = false;
}
function closeCal(ok) {
  if (ok) { const t = $('#cal-time').value; dueVal = calSel ? calSel + (t ? 'T' + t : '') : ''; updateDueBtn(); }
  $('#cal').hidden = true;
}

document.addEventListener('click', e => {
  const tb = e.target.closest('[data-tab]'); if (tb) return show(tb.dataset.tab);
  if (e.target.id === 'cal') return closeCal(false);
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, id = b.dataset.id;
  if (a === 'cvgo') { $('#cover').classList.add('hide'); under.forEach(e => e.inert = false); return; }
  if (a === 'dsel') { selDay = b.dataset.day; return show('tasks'); }
  if (a === 'dnone') { selDay = ''; return show('tasks'); }
  if (a === 'dtoday') { selDay = iso(new Date()); weekMon = mondayOf(new Date()); return show('tasks'); }
  if (a === 'wk') { const dir = +b.dataset.d; weekMon = new Date(weekMon); weekMon.setDate(weekMon.getDate() + 7 * dir); if (selDay) { const sd = new Date(selDay + 'T00:00'); sd.setDate(sd.getDate() + 7 * dir); selDay = iso(sd); } return show('tasks'); }
  if (a === 'co') return openCal();
  if (a === 'cok') return closeCal(true);
  if (a === 'cclr') { calSel = ''; $('#cal-time').value = ''; return renderCal(); }
  if (a === 'cn') { const d = new Date(calView.y, calView.m + +b.dataset.d, 1); calView = { y: d.getFullYear(), m: d.getMonth() }; return renderCal(); }
  if (a === 'cp') { calSel = b.dataset.day; const d = new Date(calSel + 'T00:00'); calView = { y: d.getFullYear(), m: d.getMonth() }; return renderCal(); }
  if (a === 'ta') { const v = $('#task-in').value.trim(); if (v) { S.tasks.unshift({ id: uid(), text: v, done: false, due: dueVal || selDay }); if (dueVal) { selDay = dueVal.slice(0, 10); weekMon = mondayOf(new Date(selDay + 'T00:00')); } $('#task-in').value = ''; dueVal = ''; updateDueBtn(); } }
  if (a === 'tt') { const t = S.tasks.find(x => x.id === id); if (t) { t.done = !t.done; t.doneAt = t.done ? iso(new Date()) : ''; } }
  if (a === 'td') S.tasks = S.tasks.filter(x => x.id !== id);
  if (a === 'ha') { const v = $('#habit-in').value.trim(); if (v) { S.habits.push({ id: uid(), name: v, done: {}, created: iso(new Date()) }); $('#habit-in').value = ''; } }
  if (a === 'hd') { const h = S.habits.find(x => x.id === id), k = b.dataset.day; if (h) { if (h.done[k]) delete h.done[k]; else h.done[k] = true; } }
  if (a === 'hx') S.habits = S.habits.filter(x => x.id !== id);
  if (a === 'hm') { const d = new Date(habView.y, habView.m + +b.dataset.d, 1); habView = { y: d.getFullYear(), m: d.getMonth() }; return show('habits'); }
  if (a === 'gtog') { if (openGoals.has(id)) openGoals.delete(id); else openGoals.add(id); return show('goals'); }
  if (a === 'ga') { const v = $('#goal-in').value.trim(); if (v) { const gid = uid(); S.goals.push({ id: gid, name: v }); openGoals.add(gid); $('#goal-in').value = ''; } }
  if (a === 'gx') { S.goals = S.goals.filter(x => x.id !== id); S.tasks.forEach(t => { if (t.goalId === id) delete t.goalId; }); }
  if (a === 'gta') { const v = $('#gt-' + id).value.trim(); if (v) S.tasks.unshift({ id: uid(), text: v, done: false, due: '', goalId: id }); }
  save(); show(tab);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#cal').hidden) return closeCal(false);
  if (e.key !== 'Enter') return;
  if (e.target.id === 'task-in') document.querySelector('[data-a="ta"]').click();
  if (e.target.id === 'habit-in') document.querySelector('[data-a="ha"]').click();
  if (e.target.id === 'goal-in') document.querySelector('[data-a="ga"]').click();
  if (e.target.id.startsWith('gt-')) e.target.nextElementSibling.click();
});
show('tasks');
</script>
</body>
</html>
